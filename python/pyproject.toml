[project]
name = "gesturespeak-python"
version = "0.1.0"
description = "GestureSpeak ML training pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "tensorflow[and-cuda]>=2.15.0,<2.17.0",
    "pillow>=9.0.0",
    "numpy<2.0.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "tensorflowjs>=4.10.0",
    "setuptools<70.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
